services:
  # Headless mode: run once and exit (invoke via host cron or systemd timer)
#  em-phi:
#    image: nejcsusin/em-phi:latest
#    build: .
#    volumes:
#      - ./data:/data
#    environment:
#      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
#      EM_PHI_CONFIG: /data/config.yaml
#    # Default CMD is "serve". Override with: command: ["run"] or command: ["run", "--dry-run"]

  # Web mode: always-on dashboard with built-in scheduler
  # Requires a 'web:' block in config.yaml (see config.example.yaml)
  em-phi-web:
    image: nejcsusin/em-phi:latest
    build: .
    command: ["serve"]
    volumes:
      - ./data:/data
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      EM_PHI_CONFIG: /data/config.yaml
    # web.host in config.yaml must be 0.0.0.0 inside the container, otherwise
    # the published port can't reach the server (the default is 127.0.0.1).
    ports:
      - "8080:8080"
    restart: unless-stopped
